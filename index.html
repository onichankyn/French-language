<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Французский 🇫🇷</title>
<style>
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  @keyframes pop{0%{transform:scale(.92); opacity:0;} 100%{transform:scale(1); opacity:1;}}
  @keyframes glow{0%,100%{box-shadow:0 0 18px rgba(232,133,61,.35);} 50%{box-shadow:0 0 30px rgba(224,90,61,.55);}}
  :root{
    --bg:#1b120c; --bgsoft:#2a1d13; --card:#2c1f16; --card2:#3b2a1d;
    --txt:#faf3e7; --sub:#d9b98c; --accent:#e8853d; --accent2:#f2b04c;
    --green:#82b356; --red:#e55b53; --amber:#f2b04c;
    --radius:20px;
    --grad:linear-gradient(135deg,#e8853d,#e05a3d);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(120% 80% at 20% 0%,#33220f 0%,var(--bg) 55%),var(--bg);
    color:var(--txt); min-height:100vh; overflow-x:hidden;
    padding-bottom:calc(60px + env(safe-area-inset-bottom));
  }
  .banner-wrap{
    position:relative; margin:0; padding:0; height:118px; overflow:hidden;
    background:linear-gradient(115deg,#3a2412 0%,#6b3417 45%,#a34a1f 100%);
  }
  .banner-wrap::before{content:'🇫🇷'; position:absolute; right:8%; top:50%; transform:translateY(-50%); font-size:64px; filter:drop-shadow(0 6px 18px rgba(0,0,0,.4));}
  .banner-wrap::after{
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(120% 120% at 85% 40%, rgba(255,205,130,.22) 0%, transparent 55%),
      linear-gradient(90deg, rgba(27,18,12,.0) 0%, rgba(27,18,12,.35) 100%);
  }
  .banner-wrap .ovl{position:absolute; inset:0; background:linear-gradient(90deg,transparent 30%,rgba(20,12,6,.35) 100%);}
  header{
    position:relative; z-index:10; background:var(--bg);
    padding:13px 16px 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  header h1{font-size:19px; margin:0; font-weight:800; letter-spacing:.3px; color:var(--txt);}
  header .streak{
    font-size:14px; color:var(--accent2); font-weight:700;
    background:rgba(242,176,76,.14); padding:6px 12px; border-radius:999px;
  }
  main{padding:16px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .mbtn{
    position:relative; background:var(--card); border:1px solid rgba(255,255,255,.06);
    color:var(--txt); text-align:left; border-radius:var(--radius); padding:20px 18px;
    font-size:16px; font-weight:700; cursor:pointer;
    display:flex; flex-direction:column; gap:7px; overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.3);
    transition:transform .15s, box-shadow .2s;
    animation:fadeUp .35s ease both;
  }
  .mbtn:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .mbtn:active{transform:scale(.96);}
  .mbtn .emoji{font-size:30px; line-height:1;}
  .mbtn .desc{font-size:12px; color:var(--sub); font-weight:500;}
  .mbtn::after{
    content:''; position:absolute; top:0; right:0; width:90px; height:90px; border-radius:50%;
    background:var(--grad); opacity:.18; filter:blur(18px); transform:translate(20%,-30%);
  }
  .card{
    background:var(--card); border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius); padding:22px 18px;
    margin-bottom:14px; box-shadow:0 4px 18px rgba(0,0,0,.28);
    animation:fadeUp .3s ease both;
  }
  .card h2{margin:0 0 14px; font-size:18px; font-weight:800;}
  .center{text-align:center;}
  .big{font-size:32px; font-weight:800; margin:10px 0;}
  .sub{color:var(--sub); font-size:13px;}
  .translit{color:#f0a85a; font-size:16px;}
  button.primary, a.primary{
    background:var(--grad); color:#fff; border:none; border-radius:15px;
    padding:16px; font-size:16px; font-weight:700; cursor:pointer; width:100%;
    display:block; text-align:center; text-decoration:none;
    box-shadow:0 6px 20px rgba(232,133,61,.35);
    transition:transform .15s, box-shadow .2s;
  }
  button.primary:hover{box-shadow:0 8px 26px rgba(232,133,61,.5);}
  button.primary:active{transform:scale(.97);}
  button.secondary{
    background:var(--card2); color:var(--txt); border:none; border-radius:13px;
    padding:13px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .row{display:flex; gap:10px; margin-top:14px;}
  .row > *{flex:1;}
  .badge{
    display:inline-block; background:rgba(242,176,76,.16); border-radius:999px;
    padding:5px 12px; font-size:12px; color:#f0a85a; font-weight:600;
  }
  .wordlist .w{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 4px; border-bottom:1px solid rgba(255,255,255,.06);
  }
  .wordlist .w:last-child{border-bottom:none;}
  .wordlist .fr{font-weight:700;}
  .wordlist .ru{color:var(--sub); font-size:13px;}
  .wordlist .b{
    color:#f0a85a; font-size:12px; background:rgba(242,176,76,.12);
    padding:3px 9px; border-radius:999px; font-weight:600;
  }
  .stat{display:flex; justify-content:space-between; padding:11px 4px; border-bottom:1px solid rgba(255,255,255,.06); font-size:15px;}
  .stat:last-child{border-bottom:none;}
  .stat b{color:var(--accent2);}
  input[type=text]{
    width:100%; background:var(--card2); border:1px solid rgba(255,255,255,.08);
    color:var(--txt); border-radius:13px; padding:14px; font-size:15px; margin-bottom:10px;
    outline:none; transition:border .2s;
  }
  input[type=text]:focus{border-color:var(--accent);}
  .banner{background:var(--red); color:#fff; padding:12px; border-radius:12px; margin-bottom:14px; font-size:14px;}
  .ok{background:var(--green); color:#16220b; padding:12px; border-radius:12px; margin:12px 0; font-weight:700; text-align:center;}
  .box-line{height:9px; background:var(--card2); border-radius:999px; overflow:hidden; margin:12px 0;}
  .box-fill{height:100%; background:var(--grad); border-radius:999px; transition:width .4s;}
  .feedback{font-size:15px; font-weight:700; min-height:22px;}
  .green-btn{
    flex:1; background:var(--grad); color:#fff; border:none; padding:13px 12px;
    border-radius:13px; font-weight:700; font-size:14px;
  }
  .hero-title{
    font-size:20px; font-weight:800; margin:6px 0 2px;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
</style>
</head>
<body>
<div class="banner-wrap">
  <div class="ovl"></div>
</div>
<header>
  <h1>🇫🇷 Французский</h1>
  <span class="streak">🔥 <span id="streakNum">0</span></span>
</header>

<main id="app"></main>

<script>
// ===== Telegram Mini App API =====
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#0f172a'); tg.setBackgroundColor('#0f172a'); } catch(e){}
}

// ===== Сохранение данных (localStorage) =====
const LS_KEY = 'french_app_v1';
function loadData(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { words: null, learned: 0, done: 0, streak: 1, lastDay: null };
}
const DATA = loadData();
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(DATA)); } catch(e){}
  updateStreak();
}

// ===== Встроенный словарь =====
const BASE = [
  ["bonjour","здравствуйте, добрый день","бонжур"], ["au revoir","до свидания","о ревуар"],
  ["merci","спасибо","мерси"], ["s'il vous plaît","пожалуйста","силь ву пле"],
  ["oui","да","уи"], ["non","нет","нон"],
  ["parler","говорить","парле"], ["manger","есть, кушать","манже"],
  ["boire","пить","буар"], ["dormir","спать","дормир"],
  ["aimer","любить","эме"], ["apprendre","учить, узнавать","апрандр"],
  ["travailler","работать","травае"], ["être","быть","этр"],
  ["avoir","иметь","авуар"], ["aller","идти, ехать","але"],
  ["faire","делать","фэр"], ["voir","видеть","вуар"],
  ["écouter","слушать","экуте"], ["regarder","смотреть","регарде"],
  ["livre","книга","ливр"], ["maison","дом","мезон"],
  ["ville","город","виль"], ["ami","друг","ами"],
  ["famille","семья","фамий"], ["jour","день","жур"],
  ["nuit","ночь","нюи"], ["temps","время / погода","тан"],
  ["eau","вода","о"], ["pain","хлеб","пэн"],
  ["fromage","сыр","фромаж"], ["café","кофе / кафе","кафе"],
  ["vin","вино","вэн"], ["école","школа","эколь"],
  ["mer","море","мэр"], ["soleil","солнце","солей"],
  ["chien","собака","шьен"], ["chat","кот","ша"],
  ["bon","хороший","бон"], ["grand","большой","гран"],
  ["petit","маленький","пти"], ["je","я","жё"],
  ["tu","ты","тю"], ["il","он","иль"],
  ["elle","она","эль"], ["nous","мы","ну"],
  ["vous","вы","ву"], ["et","и","э"],
  ["mais","но","мэ"], ["avec","с (с кем-то)","авэк"],
  ["dans","в (внутри)","дан"], ["pour","для, чтобы","пур"],
  ["très","очень","трэ"], ["beaucoup","много","боку"],
  ["comment","как","коман"], ["pourquoi","почему","пуркуа"]
];
function getWords(){
  if (!DATA.words){
    DATA.words = BASE.map((w,i)=>({id:'b'+i, fr:w[0], ru:w[1], translit:w[2], box:0}));
    save();
  }
  return DATA.words;
}
function addUserWords(){ return DATA.words.filter(w=>!w.id.startsWith('b')); }

// ===== Прогресс / серия =====
function todayStr(){ return new Date().toISOString().slice(0,10); }
function updateStreak(){
  const today = todayStr();
  if (DATA.lastDay && DATA.lastDay !== today){
    const prev = new Date(DATA.lastDay);
    const diff = (new Date(today) - prev)/86400000;
    if (diff === 1) DATA.streak++;
    else DATA.streak = 1;
    DATA.lastDay = today; save();
  } else if (!DATA.lastDay){
    DATA.lastDay = today; save();
  }
  const el = document.getElementById('streakNum');
  if (el) el.textContent = DATA.streak;
}

// ===== Вспомогательные =====
const app = document.getElementById('app');
function render(html){ app.innerHTML = html; window.scrollTo(0,0); }
function head(){ return `<h2></h2>`; }
function backBtn(){ return `</div><div class="row"><button class="secondary" onclick="renderMenu()">← Меню</button></div>`; }

const IRREGULAR = {
  "être":"je suis · tu es · il/elle est · nous sommes · vous êtes · ils/elles sont",
  "avoir":"j'ai · tu as · il/elle a · nous avons · vous avez · ils/elles ont",
  "aller":"je vais · tu vas · il/elle va · nous allons · vous allez · ils/elles vont",
  "faire":"je fais · tu fais · il/elle fait · nous faisons · vous faites · ils/elles font",
  "venir":"je viens · tu viens · il/elle vient · nous venons · vous venez · ils/elles viennent",
  "dire":"je dis · tu dis · il/elle dit · nous disons · vous dites · ils/elles disent",
  "pouvoir":"je peux · tu peux · il/elle peut · nous pouvons · vous pouvez · ils/elles peuvent",
  "vouloir":"je veux · tu veux · il/elle veut · nous voulons · vous voulez · ils/elles veulent",
  "prendre":"je prends · tu prends · il/elle prend · nous prenons · vous prenez · ils/elles prennent"
};
function conjugate(v){
  v = v.trim().toLowerCase().replace(/'+$/,'');
  if (IRREGULAR[v]) return IRREGULAR[v];
  if (v.endsWith('er') && v.length>2){ const s=v.slice(0,-2); return `je ${s}e · tu ${s}es · il/elle ${s}e · nous ${s}ons · vous ${s}ez · ils/elles ${s}ent`; }
  if (v.endsWith('ir') && v.length>2){ const s=v.slice(0,-2); return `je ${s}is · tu ${s}is · il/elle ${s}it · nous ${s}issons · vous ${s}issez · ils/elles ${s}issent`; }
  if (v.endsWith('re') && v.length>2){ const s=v.slice(0,-2); return `je ${s}s · tu ${s}s · il/elle ${s} · nous ${s}sons · vous ${s}sez · ils/elles ${s}sent`; }
  return null;
}

// ===== Меню =====
function renderMenu(){
  updateStreak();
  const words = getWords();
  render(`
    <div class="center" style="margin-bottom:14px; animation:fadeUp .4s ease both;">
      <div class="hero-title">Bonjour, c'est parti !</div>
      <div class="sub">Изучай французский с удовольствием</div>
    </div>
    <div class="grid">
      <button class="mbtn" onclick="renderCards()"><span class="emoji">🧠</span>Карточки<span class="desc">интервальное повторение</span></button>
      <button class="mbtn" onclick="renderExercise()"><span class="emoji">✏️</span>Упражнения<span class="desc">тест на перевод</span></button>
      <button class="mbtn" onclick="renderWords()"><span class="emoji">📚</span>Словарь<span class="desc">${words.length} слов</span></button>
      <button class="mbtn" onclick="renderConj()"><span class="emoji">🔤</span>Спряжения<span class="desc">глаголы</span></button>
      <button class="mbtn" onclick="renderDialogues()"><span class="emoji">💬</span>Диалоги<span class="desc">фразы для общения</span></button>
      <button class="mbtn" onclick="renderProgress()"><span class="emoji">📊</span>Прогресс<span class="desc">статистика</span></button>
      <button class="mbtn" onclick="renderAddWord()"><span class="emoji">➕</span>Свои слова<span class="desc">добавить новое</span></button>
      <button class="mbtn" onclick="renderHelp()"><span class="emoji">ℹ️</span>Помощь<span class="desc">как пользоваться</span></button>
    </div>
  `);
}

// ===== Карточки =====
let cardQueue = [];
function renderCards(){
  const words = getWords().filter(w=>w.box < 5);
  if (!words.length){
    render(`<div class="card center"><h2>Поздравляем! 🎉</h2><p class="sub">Все слова усвоены. Добавь новые или приходи завтра.</p>${backBtn()}`);
    return;
  }
  cardQueue = [...words].sort((a,b)=>a.box-b.box || Math.random()-0.5);
  showCard();
}
function showCard(){
  if (!cardQueue.length){ renderMenu(); return; }
  const w = cardQueue.shift();
  render(`
    <div class="card">
      <div class="badge">Уровень ${w.box}/5</div>
      <div class="center">
        <div class="big">${w.fr}</div>
        <div class="translit">${w.translit}</div>
      </div>
    </div>
    <button class="primary" onclick="revealCard('${w.id}')">Показать перевод</button>
    <div class="row"><button class="secondary" onclick="renderMenu()">← Меню</button></div>
  `);
}
function revealCard(id){
  const w = getWords().find(x=>x.id===id); if(!w) return;
  const top = document.querySelector('.btnarea');
  top.innerHTML =
    `<div class="card center"><div class="big">${w.ru}</div><div class="sub">${w.translit}</div></div>
     <div class="row"><button class="secondary" onclick="rateCard('${id}',1)">🤔 Не уверен</button>
     <button class="green-btn" onclick="rateCard('${id}',0)">😄 Знаю</button></div>`;
}
function rateCard(id, again){
  const w = getWords().find(x=>x.id===id); if(!w) return;
  w.box = again ? 0 : Math.min(w.box+1, 5);
  DATA.done++; if(!again) DATA.learned++;
  save();
  showCard();
}

// ===== Упражнения =====
let exState = null;
function renderExercise(){
  exState = { dir: Math.random()<0.5?'fr2ru':'ru2fr', answer:'', wordId:null };
  render(`
    <div id="qbox"></div>
    <div class="row"><button class="secondary" onclick="renderMenu()">← Меню</button></div>
  `);
  setTimeout(nextExercise, 0);
}
function nextExercise(){
  const words = getWords(); if(!words.length){ renderMenu(); return; }
  const w = words[Math.floor(Math.random()*words.length)];
  exState.wordId = w.id;
  exState.dir = Math.random()<0.5?'fr2ru':'ru2fr';
  const q = exState.dir==='fr2ru' ? w.fr : w.ru;
  exState.answer = (exState.dir==='fr2ru'? w.ru : w.fr).toLowerCase();
  const hint = exState.dir==='fr2ru' ? w.translit : '';
  document.getElementById('qbox').innerHTML =
    `<div class="card center"><h2>Переведи:</h2><div class="big">🇫🇷 ${q}</div>${hint?'<div class="translit">'+hint+'</div>':''}</div>
     <input type="text" id="exinput" placeholder="Твой ответ…">
     <button class="primary" onclick="checkEx()">Проверить</button>
     <div class="feedback" id="exfb"></div>`;
  document.getElementById('exinput').focus();
}
function checkEx(){
  const input = document.getElementById('exinput');
  const val = input.value.trim().toLowerCase();
  const fb = document.getElementById('exfb');
  if (val === exState.answer){
    DATA.done++; save();
    fb.innerHTML = '<span style="color:var(--green)">✅ Правильно!</span>';
  } else {
    fb.innerHTML = `❌ Правильно: <b style="color:var(--amber)">${exState.answer}</b>`;
  }
  setTimeout(nextExercise, 1400);
}

// ===== Словарь =====
function renderWords(){
  const words = getWords();
  render(`
    <div class="card"><h2>📚 Словарь (${words.length})</h2>
      <div class="wordlist">
        ${words.map(w=>`<div class="w">
          <div><span class="fr">${w.fr}</span> <span class="ru">— ${w.ru}</span></div>
          <span class="b">ур.${w.box}</span>
        </div>`).join('')}
      </div>
    </div>
    ${backBtn()}
  `);
}

// ===== Спряжения =====
function renderConj(){
  render(`
    <div class="card"><h2>🔤 Спряжения</h2>
      <p class="sub">Выбери глагол или введи свой (parler, finir, vendre…)</p>
      <div class="grid">
        ${Object.keys(IRREGULAR).map(v=>`<button class="mbtn" onclick="showConj('${v}')"><span class="emoji">📖</span>${v}</button>`).join('')}
      </div>
      <input type="text" id="conjin" placeholder="Введи глагол…" onkeydown="if(event.key==='Enter')conjInput()">
      <button class="primary" onclick="conjInput()">Спрягать</button>
      <div id="conjout"></div>
    </div>
    ${backBtn()}
  `);
}
function showConj(v){
  const res = conjugate(v);
  document.getElementById('conjout').innerHTML = `<div class="card center"><div class="big">${v}</div><div class="sub">${res}</div></div>`;
}
function conjInput(){
  const v = document.getElementById('conjin').value;
  const res = conjugate(v);
  if (!res){ document.getElementById('conjout').innerHTML='<div class="banner">Не распознал глагол. Попробуй, напр.: chanter, finir, vendre</div>'; return; }
  showConj(v);
}

// ===== Диалоги =====
const DIALOGUES = [
  {name:"💬 Знакомство", text:"— Bonjour ! Comment t'appelles-tu ?\n— Je m'appelle Anna. Et toi ?\n— Moi, c'est Marc. Enchanté !", ru:"— Здравствуй! Как тебя зовут?\n— Меня зовут Анна. А ты?\n— Я Марк. Очень приятно!"},
  {name:"☕ В кафе", text:"— Bonjour, je voudrais un café, s'il vous plaît.\n— Avec du lait ?\n— Non, noir, merci.", ru:"— Здравствуйте, я хотел бы кофе, пожалуйста.\n— С молоком?\n— Нет, чёрный, спасибо."},
  {name:"🗺 Спросить дорогу", text:"— Excusez-moi, où est la gare ?\n— C'est tout droit, puis à gauche.\n— Merci beaucoup !", ru:"— Извините, где вокзал?\n— Это прямо, потом налево.\n— Большое спасибо!"}
];
function renderDialogues(){
  render(`
    <div class="card"><h2>💬 Диалоги</h2>
      ${DIALOGUES.map((d,i)=>`<div class="wordlist"><div class="w" style="cursor:pointer" onclick="showDialogue(${i})"><span class="fr">${d.name}</span><span class="b">открыть →</span></div></div>`).join('')}
    </div>
    ${backBtn()}
  `);
}
function showDialogue(i){
  const d = DIALOGUES[i];
  render(`
    <div class="card"><h2>${d.name}</h2><div class="sub" style="font-size:15px;line-height:1.7;white-space:pre-line">${d.text}</div></div>
    <div class="card"><h2>🇷🇺 Перевод</h2><div class="sub" style="white-space:pre-line">${d.ru}</div></div>
    ${backBtn()}
  `);
}

// ===== Прогресс =====
function renderProgress(){
  const words = getWords();
  const learned = words.filter(w=>w.box>=3).length;
  const total = words.length;
  const pct = Math.round(learned/total*100);
  render(`
    <div class="card"><h2>📊 Твой прогресс</h2>
      <div class="stat"><span>Слов в словаре</span><b>${total}</b></div>
      <div class="stat"><span>Уверенно знаешь</span><b>${learned}</b></div>
      <div class="stat"><span>Правильных ответов</span><b>${DATA.done}</b></div>
      <div class="stat"><span>Серия занятий</span><b>🔥 ${DATA.streak} дн.</b></div>
      <div class="box-line"><div class="box-fill" style="width:${pct}%"></div></div>
      <div class="sub">Освоено ${pct}% словаря</div>
    </div>
    ${backBtn()}
  `);
}

// ===== Добавить слово =====
function renderAddWord(){
  render(`
    <div class="card"><h2>➕ Новое слово</h2>
      <input type="text" id="nf" placeholder="Слово (напр. enfant)">
      <input type="text" id="nr" placeholder="Перевод (напр. ребёнок)">
      <input type="text" id="nt" placeholder="Чтение (необязательно: анфан)">
      <button class="primary" onclick="addWord()">Сохранить</button>
      <div id="addfb"></div>
    </div>
    ${backBtn()}
  `);
}
function addWord(){
  const f = document.getElementById('nf').value.trim();
  const r = document.getElementById('nr').value.trim();
  if(!f || !r){ document.getElementById('addfb').innerHTML='<div class="banner">Заполни слово и перевод.</div>'; return; }
  getWords().push({ id:'u'+Date.now(), fr:f, ru:r, translit:document.getElementById('nt').value.trim(), box:0 });
  DATA.done++; save();
  document.getElementById('addfb').innerHTML='<div class="ok">✅ Добавлено!</div>';
  document.getElementById('nf').value=''; document.getElementById('nr').value=''; document.getElementById('nt').value='';
}
