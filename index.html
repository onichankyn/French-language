<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b120c">
<title>Французский 🇫🇷</title>
<style>
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  @keyframes pop{0%{transform:scale(.92); opacity:0;} 100%{transform:scale(1); opacity:1;}}
  @keyframes confettiFall{0%{transform:translateY(-10vh) rotate(0);} 100%{transform:translateY(110vh) rotate(720deg);}}
  @keyframes pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.05);}}
  :root{
    --bg:#1b120c; --card:#2c1f16; --card2:#3b2a1d;
    --txt:#faf3e7; --sub:#d9b98c; --accent:#e8853d; --accent2:#f2b04c;
    --green:#7fb257; --red:#e55b53; --gold:#f2b04c;
    --radius:20px;
    --grad:linear-gradient(135deg,#e8853d,#e05a3d);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(120% 80% at 20% 0%,#33220f 0%,var(--bg) 60%),var(--bg);
    color:var(--txt); min-height:100vh; overflow-x:hidden;
  }
  .app{max-width:560px; margin:0 auto; min-height:100vh;}
  .hero{
    background:linear-gradient(115deg,#3a2412 0%,#6b3417 45%,#a34a1f 100%);
    position:relative; overflow:hidden; padding:calc(18px + env(safe-area-inset-top)) 18px 34px;
  }
  .hero::before{content:'🇫🇷'; position:absolute; right:6%; top:40%; transform:translateY(-40%); font-size:72px; filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
  .hero .top{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2;}
  .hero .xp{font-weight:800; font-size:16px; background:rgba(0,0,0,.25); padding:6px 14px; border-radius:999px;}
  .hero .streak{font-weight:800; font-size:15px; background:rgba(0,0,0,.25); padding:6px 14px; border-radius:999px; color:var(--accent2);}
  .hero h1{margin:14px 0 2px; font-size:26px; font-weight:900; letter-spacing:.5px; position:relative; z-index:2;}
  .hero .goal{font-size:13px; color:rgba(255,255,255,.85); position:relative; z-index:2;}
  .goalline{height:6px; background:rgba(0,0,0,.28); border-radius:999px; overflow:hidden; margin-top:8px; position:relative; z-index:2;}
  .goalfill{height:100%; background:var(--gold); border-radius:999px; transition:width .4s;}
  main{padding:16px 16px 40px;}
  .unit{background:var(--card); border:1px solid rgba(255,255,255,.06); border-radius:var(--radius); padding:16px; margin-bottom:18px; box-shadow:0 4px 18px rgba(0,0,0,.3);}
  .unit h2{margin:0 0 4px; font-size:17px; font-weight:800;}
  .unit .utitle{color:var(--sub); font-size:12px; margin-bottom:12px; font-weight:600; letter-spacing:.5px;}
  .lesson{display:flex; align-items:center; gap:14px; padding:12px 10px; border-radius:14px; margin-bottom:8px; cursor:pointer; transition:background .15s;}
  .lesson:active{transform:scale(.98);}
  .lesson:last-child{margin-bottom:0;}
  .lesson .icon{width:46px; height:46px; min-width:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px;}
  .lesson.locked{opacity:.55; cursor:not-allowed;}
  .lesson.locked .icon{background:var(--card2);}
  .lesson.passed .icon{background:rgba(127,178,87,.2);}
  .lesson.open .icon{background:var(--grad); color:#fff; animation:pulse 2s infinite;}
  .lesson .info{flex:1;}
  .lesson .info .nm{font-weight:800; font-size:15px;}
  .lesson .info .dx{font-size:12px; color:var(--sub); display:block; margin-top:2px;}
  .lesson .stars{color:var(--gold); font-size:13px; letter-spacing:2px;}
  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .topbar .back{background:var(--card2); border:none; color:var(--txt); border-radius:12px; padding:9px 14px; font-weight:700; cursor:pointer; font-size:14px;}
  .topbar h2{flex:1; margin:0; font-size:19px; font-weight:800; text-align:center;}
  .qprogress{height:8px; background:var(--card2); border-radius:999px; overflow:hidden; margin:0 0 20px;}
  .qfill{height:100%; background:var(--grad); border-radius:999px; transition:width .3s;}
  .qcard{background:var(--card); border:1px solid rgba(255,255,255,.06); border-radius:var(--radius); padding:24px 18px; margin-bottom:16px; animation:pop .25s ease both;}
  .qprompt{font-size:13px; color:var(--sub); margin-bottom:4px; font-weight:600;}
  .qtext{font-size:26px; font-weight:800; line-height:1.35;}
  .qhint{color:var(--accent2); font-size:15px; margin-top:6px;}
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .opt{background:var(--card2); border:2px solid transparent; color:var(--txt); border-radius:14px; padding:16px 12px; font-size:15px; font-weight:600; cursor:pointer; transition:background .15s, transform .1s; min-height:54px;}
  .opt:active{transform:scale(.97);}
  .opt.sel{border-color:var(--accent); background:#3d2c1c;}
  .opt.correct{background:rgba(127,178,87,.25); border-color:var(--green);}
  .opt.wrong{background:rgba(229,91,83,.25); border-color:var(--red);}
  .infosep{height:1px; background:rgba(255,255,255,.06); margin:20px 0;}
  input.fillin{width:100%; background:var(--card2); border:2px solid rgba(255,255,255,.1); color:var(--txt); border-radius:14px; padding:16px 14px; font-size:18px; font-weight:700; outline:none; text-align:center;}
  input.fillin:focus{border-color:var(--accent);}
  .gap-word{display:inline-block; background:rgba(232,133,61,.15); border-radius:8px; padding:2px 8px; font-weight:800;}
  .match-tile{display:flex; flex-direction:column; gap:10px;}
  .mtile{display:flex; align-items:center; justify-content:space-between; background:var(--card2); border-radius:14px; padding:16px 14px; font-weight:700; cursor:pointer; transition:background .15s;}
  .mtile:active{transform:scale(.98);}
  .mtile.sel{background:#3d2c1c; border:2px solid var(--accent);}
  .mtile .ch{opacity:.0;}
  .mtile.matched{opacity:.4; pointer-events:none;}
  .btn-actions{display:flex; gap:10px; margin-top:20px;}
  .btn-actions button{flex:1; border:none; border-radius:15px; padding:16px; font-size:16px; font-weight:800; cursor:pointer;}
  .btn-check{background:var(--grad); color:#fff; box-shadow:0 6px 20px rgba(232,133,61,.35);}
  .btn-next{background:var(--green); color:#16220b;}
  .btn-skip{background:var(--card2); color:var(--sub);}
  .btn[disabled]{opacity:.4; pointer-events:none;}
  .feedback{text-align:center; font-size:15px; font-weight:800; min-height:22px; margin-top:12px;}
  .fb-correct{color:var(--green);}
  .fb-wrong{color:var(--red);}
  .card{background:var(--card); border:1px solid rgba(255,255,255,.06); border-radius:var(--radius); padding:20px 18px; margin-bottom:14px;}
  .card h2{margin:0 0 12px; font-size:18px; font-weight:800;}
  .center{text-align:center;}
  .big{font-size:32px; font-weight:800; margin:10px 0;}
  .sub{color:var(--sub); font-size:13px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .mbtn{background:var(--card); border:1px solid rgba(255,255,255,.06); color:var(--txt); text-align:left; border-radius:var(--radius); padding:18px; font-size:15px; font-weight:700; cursor:pointer; display:flex; flex-direction:column; gap:6px; box-shadow:0 4px 18px rgba(0,0,0,.3);}
  .mbtn:active{transform:scale(.97);}
  .mbtn .emoji{font-size:28px;}
  .mbtn .desc{font-size:12px; color:var(--sub); font-weight:500;}
  .wordlist .w{display:flex; justify-content:space-between; align-items:center; padding:12px 4px; border-bottom:1px solid rgba(255,255,255,.06);}
  .wordlist .w:last-child{border-bottom:none;}
  .wordlist .fr{font-weight:700;}
  .wordlist .ru{color:var(--sub); font-size:13px;}
  .stat{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:15px;}
  .stat:last-child{border-bottom:none;}
  .stat b{color:var(--accent2);}
  input[type=text]{width:100%; background:var(--card2); border:1px solid rgba(255,255,255,.08); color:var(--txt); border-radius:13px; padding:14px; font-size:15px; margin-bottom:10px; outline:none;}
  input[type=text]:focus{border-color:var(--accent);}
  .banner{background:var(--red); color:#fff; padding:12px; border-radius:12px; margin-bottom:14px; font-size:14px;}
  .ok{background:var(--green); color:#16220b; padding:12px; border-radius:12px; margin:12px 0; font-weight:700; text-align:center;}
  /* Завершение урока */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:100; animation:fadeUp .25s ease both;}
  .complete{width:100%; max-width:560px; background:var(--card); border-radius:24px 24px 0 0; padding:28px 22px calc(30px + env(safe-area-inset-bottom)); text-align:center; animation:pop .3s ease both; position:relative;}
  .confetti{position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:99; overflow:hidden;}
  .confetti span{position:absolute; top:-20px; width:10px; height:16px; opacity:.9; animation:confettiFall linear forwards;}
  .complete .big{font-size:40px;}
  .complete h2{font-size:26px; margin:8px 0;}
  .complete .xpget{font-size:18px; font-weight:800; color:var(--gold); margin:12px 0 20px;}
  .complete p{color:var(--sub); font-size:14px;}
  .btn-done{background:var(--grad); color:#fff; border:none; border-radius:15px; padding:16px; font-size:16px; font-weight:800; width:100%; cursor:pointer; box-shadow:0 6px 20px rgba(232,133,61,.35);}
</style>
</head>

<script>
const tg = window.Telegram?.WebApp;
if (tg){ tg.ready(); tg.expand(); try{ tg.setHeaderColor('#1b120c'); tg.setBackgroundColor('#1b120c'); }catch(e){} }

const LS_KEY = 'french_app_v2';
function loadData(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { xp:0, done:0, streak:1, lastDay:null, completed:{}, stars:{} };
}
const DATA = loadData();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){} updateHeader(); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function updateStreak(){
  const t = todayStr();
  if(DATA.lastDay && DATA.lastDay !== t){
    const prev = new Date(DATA.lastDay); const diff = (new Date(t)-prev)/86400000;
    if(diff===1) DATA.streak++; else DATA.streak=1;
    DATA.lastDay=t; save();
  } else if(!DATA.lastDay){ DATA.lastDay=t; save(); }
}

        {t:'type', p:'Переведи «ночь»', a:'nuit'},
        {t:'type', p:'Переведи «утро»', a:'matin'},
        {t:'choice', p:'«Soir» — это…', a:'вечер', o:['вечер','утро','день','ночь']},
        {t:'match', p:'Соедини', pairs:[['nuit','ночь'],['matin','утро'],['soir','вечер'],['jour','день']]}
      ]}
    ]}
];

const TOOLS = [
  {id:'dict', name:'Словарь', icon:'📚', desc:'все слова', fn:'renderDict'},
  {id:'conj', name:'Спряжения', icon:'🔤', desc:'глаголы', fn:'renderConj'},
  {id:'dial', name:'Фразы', icon:'💬', desc:'диалоги', fn:'renderDial'}
];

const IRREGULAR = {
  "être":"je suis · tu es · il/elle est · nous sommes · vous êtes · ils/elles sont",
  "avoir":"j'ai · tu as · il/elle a · nous avons · vous avez · ils/elles ont",
  "aller":"je vais · tu vas · il/elle va · nous allons · vous allez · ils/elles vont",
  "faire":"je fais · tu fais · il/elle fait · nous faisons · vous faites · ils/elles font",
  "venir":"je viens · tu viens · il/elle vient · nous venons · vous venez · ils/elles viennent",
  "dire":"je dis · tu dis · il/elle dit · nous disons · vous dites · ils/elles disent"
};
function conjugate(v){
  v=v.trim().toLowerCase().replace(/'+$/,'');
  if(IRREGULAR[v]) return IRREGULAR[v];
  if(v.endsWith('er')&&v.length>2){const s=v.slice(0,-2);return `je ${s}e · tu ${s}es · il/elle ${s}e · nous ${s}ons · vous ${s}ez · ils/elles ${s}ent`;}
  if(v.endsWith('ir')&&v.length>2){const s=v.slice(0,-2);return `je ${s}is · tu ${s}is · il/elle ${s}it · nous ${s}issons · vous ${s}issez · ils/elles ${s}issent`;}
  if(v.endsWith('re')&&v.length>2){const s=v.slice(0,-2);return `je ${s}s · tu ${s}s · il/elle ${s} · nous ${s}sons · vous ${s}sez · ils/elles ${s}sent`;}
  return null;
}
const DIALOGUES = [
  {name:"💬 Знакомство", text:"— Bonjour ! Comment t'appelles-tu ?\n— Je m'appelle Anna. Et toi ?\n— Moi, c'est Marc. Enchanté !", ru:"— Здравствуй! Как тебя зовут?\n— Меня зовут Анна. А ты?\n— Я Марк. Очень приятно!"},
  {name:"☕ В кафе", text:"— Bonjour, je voudrais un café, s'il vous plaît.\n— Avec du lait ?\n— Non, noir, merci.", ru:"— Здравствуйте, я хотел бы кофе, пожалуйста.\n— С молоком?\n— Нет, чёрный, спасибо."},
  {name:"🗺 Спросить дорогу", text:"— Excusez-moi, où est la gare ?\n— C'est tout droit, puis à gauche.\n— Merci beaucoup !", ru:"— Извините, где вокзал?\n— Это прямо, потом налево.\n— Большое спасибо!"}
];

// ===== Прогресс уроков =====
function allLessons(){
  const out=[];
  UNITS.forEach(u=>u.lessons.forEach(l=>out.push({...l, unitId:u.id})));
  return out;
}
function lessonNumber(id){ return allLessons().findIndex(l=>l.id===id); }
function isUnlocked(lessonId){
  const idx = lessonNumber(lessonId);
  if(idx<=0) return true;
  const prev = allLessons()[idx-1];
  return DATA.completed[prev.id]===true;
}
function unitCompleted(u){ return u.lessons.every(l=>DATA.completed[l.id]); }

// ===== Рендеринг =====
const app = document.getElementById('app');
const overlayRoot = document.getElementById('overlayRoot');
function render(html){ app.innerHTML=html; window.scrollTo(0,0); }
function updateHeader(){
  const e=document.querySelector('.hero .xp'); if(e) e.textContent='⚡ '+DATA.xp;
  const s=document.querySelector('.hero .streak'); if(s) s.textContent='🔥 '+DATA.streak;
}

const DAILY_GOAL = 20;
function dailyPct(){ return DATA.done>=DAILY_GOAL?1:Math.round(DATA.done/DAILY_GOAL*100); }

// ===== Главный экран: юниты =====
function renderMenu(){
  updateStreak();
  const pct=dailyPct();
  render(`
    <div class="hero">
      <div class="top">
        <span class="xp">⚡ <span id="xpTop">${DATA.xp}</span></span>
        <span class="streak">🔥 <span id="streakTop">${DATA.streak}</span></span>
      </div>
      <h1>Французский</h1>
      <div class="goal">Цель дня: ${DATA.done}/${DAILY_GOAL} · учись каждый день!</div>
      <div class="goalline"><div class="goalfill" style="width:${pct}%"></div></div>
    </div>
    ${UNITS.map(u=>`
      <div class="unit">
        <h2>${u.title}</h2>
        <div class="utitle">Юнит · ${unitCompleted(u)?'✅ пройдено':'продолжай'}</div>
        ${u.lessons.map(l=>{
          const num=lessonNumber(l.id);
          const locked=!isUnlocked(l.id);
          const passed=DATA.completed[l.id];
          const stars=DATA.stars[l.id]||0;
          const starHtml='★'.repeat(3);
          return `<div class="lesson ${locked?'locked':passed?'passed':'open'}" onclick="${locked?'':'startLesson(\''+l.id+'\')'}">
            <div class="icon">${locked?'🔒':passed?'✅':l.icon}</div>
            <div class="info">
              <span class="nm">${l.name}</span>
              <span class="dx">${passed?'Пройдено · +'+l.xp+' XP':l.q.length+' заданий · +'+l.xp+' XP'}</span>
            </div>
            <div class="stars">${passed?starHtml:''}</div>
          </div>`;
        }).join('')}
      </div>
    `).join('')}
    <div class="unit">
      <h2>Инструменты</h2>
      <div class="utitle">справка и проверка</div>
      <div class="grid2">
        ${TOOLS.map(t=>`<button class="mbtn" onclick="${t.fn}()"><span class="emoji">${t.icon}</span>${t.name}<span class="desc">${t.desc}</span></button>`).join('')}
      </div>
    </div>
  `);
}

// ===== Прохождение урока =====
let LS = { lesson:null, idx:0, correct:0, sel:null, matchSel:null, matchPairs:[], inp:null };
function startLesson(id){
  const all=allLessons(); const l=all.find(x=>x.id===id); if(!l) return;
  if(!isUnlocked(id)) return;
  LS={ lesson:l, idx:0, correct:0, sel:null, matchSel:null, matchPairs:[], inp:null };
  showQuestion();
}
function showQuestion(){
  if(LS.idx>=LS.lesson.q.length){ finishLesson(); return; }
  const q=LS.lesson.q[LS.idx];
  LS.sel=null; LS.matchSel=null; LS.matchPairs=[]; LS.inp=null;
  const prog=Math.round(LS.idx/LS.lesson.q.length*100);
  let body='';
  if(q.t==='choice'){
    body=`<div class="qcard">
      <div class="qprompt">${q.p}</div>
      <div class="qtext">${q.q||q.a}</div>
    </div>
    <div class="opts">
      ${q.o.map(o=>`<button class="opt" data-v="${o}" onclick="pickOpt(this,'${o}')">${o}</button>`).join('')}
    </div>`;
  } else if(q.t==='type'){
    body=`<div class="qcard">
      <div class="qprompt">${q.p}</div>
      <div class="qtext">${q.q}</div>
      ${q.hint?`<div class="qhint">💡 ${q.hint}</div>`:''}
    </div>
    <input type="text" class="fillin" id="fillin" placeholder="Напиши ответ…" autocomplete="off" autocapitalize="off" autocorrect="off">`;
  } else if(q.t==='gap'){
    const parts=q.text.split('___');
    body=`<div class="qcard">
      <div class="qprompt">${q.p}</div>
      <div class="qtext">${parts[0]}<span class="gap-word">___</span>${parts[1]}</div>
      ${q.hint?`<div class="qhint">💡 ${q.hint}</div>`:''}
    </div>
    <input type="text" class="fillin" id="fillin" placeholder="Вставь слово…">`;
  } else if(q.t==='match'){
    LS.matchPairs=shuffle(q.pairs.flatMap(p=>p)).map(v=>({v, matched:false}));
    body=`<div class="qcard"><div class="qprompt">${q.p}</div></div>
    <div class="match-tile">
      ${LS.matchPairs.map((p,i)=>`<div class="mtile" data-i="${i}" onclick="pickMatch(${i})"><span>${p.v}</span><span class="ch">${p.matched?'✓':''}</span></div>`).join('')}
    </div>`;
  }
  render(`<div class="topbar"><button class="back" onclick="leaveLesson()">✕</button><h2>${LS.lesson.name}</h2><span>${LS.idx+1}/${LS.lesson.q.length}</span></div>
    <div class="qprogress"><div class="qfill" style="width:${prog}%"></div></div>
    ${body}
    <div id="actionsArea"></div>
    <div class="feedback" id="fb"></div>
  `);
  if(q.t==='type'||q.t==='gap'){
    const inp=document.getElementById('fillin');
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') checkAnswer(); });
    inp.focus();
    LS.inp=inp;
  } else if(q.t==='choice'){
    renderActionsCheck();
  } else if(q.t==='match'){
    renderMatchBar();
  }
}
function renderActionsCheck(){
  document.getElementById('actionsArea').innerHTML=`<div class="btn-actions"><button class="btn btn-check btn" id="chkB" disabled onclick="checkAnswer()">Проверить</button></div>`;
}
function renderActionsNext(){
  document.getElementById('actionsArea').innerHTML=`<div class="btn-actions"><button class="btn btn-next btn" onclick="nextQ()">Продолжить →</button></div>`;
}
function renderMatchBar(){
  document.getElementById('actionsArea').innerHTML=`<div class="btn-actions"><button class="btn btn-check btn" id="chkB" onclick="checkMatch()">Проверить</button></div>`;
}
function pickOpt(btn,v){
  if(LS.sel) return; // уже выбрано
  document.querySelectorAll('.opt.sel').forEach(x=>x.classList.remove('sel'));
  btn.classList.add('sel'); LS.sel=v;
  document.getElementById('chkB').disabled=false;
}
function pickMatch(i){
  const p=LS.matchPairs[i]; if(p.matched) return;
  if(LS.matchSel===null){
    LS.matchSel=i;
    document.querySelectorAll('.mtile.sel').forEach(x=>x.classList.remove('sel'));
    document.querySelector(`.mtile[data-i="${i}"]`).classList.add('sel');
  } else if(LS.matchSel===i){
    LS.matchSel=null;
    document.querySelector(`.mtile[data-i="${i}"]`).classList.remove('sel');
  } else {
    const j=LS.matchSel;
    const a=LS.matchPairs[j], b=LS.matchPairs[i];
    // проверяем, образуют ли они пару (фр+ру)
    const pair=LS.lesson.q[LS.idx].pairs;
    const isPair=pair.some(p=>{ const s=new Set(p); return s.has(a.v)&&s.has(b.v); });
    if(isPair){
      a.matched=true; b.matched=true;
      document.querySelectorAll('.mtile.sel').forEach(x=>x.classList.remove('sel'));
      const i1=j,i2=i;
      LS.matchPairs[i1].matched=true; LS.matchPairs[i2].matched=true;
    } else {
      const ea=document.querySelector(`.mtile[data-i="${j}"]`);
      const eb=document.querySelector(`.mtile[data-i="${i}"]`);
      ea.style.border='2px solid var(--red)';
      setTimeout(()=>{ ea.style.border=''; },350);
    }
    LS.matchSel=null;
    const allMatched=LS.matchPairs.every(p=>p.matched);
    if(allMatched){ correctNow(); }
  }
}
function checkMatch(){
  // автоматически отмечается по мере сопоставления
}
function checkAnswer(){
  const q=LS.lesson.q[LS.idx];
  let user='';
  if(q.t==='choice') user=LS.sel||'';
  else if(q.t==='type'||q.t==='gap') user=(document.getElementById('fillin').value||'').trim().toLowerCase();
  const answer=String(q.a||'').toLowerCase();
  let ok=false;
  if(q.t==='choice'){
    ok=user.toLowerCase()===answer;
  } else {
    ok=user===answer;
    if(!ok && q.aliases){ ok=q.aliases.some(a=>a.toLowerCase()===user); }
    if(!ok){ const norm=s=>s.replace(/[èéêë]/g,'e').replace(/[àâ]/g,'a').replace(/[ç]/g,'c').replace(/\s+/g,' ').trim();
      ok=norm(user)===norm(answer); }
  }
  const fb=document.getElementById('fb');
  if(ok){ correctNow(); }
  else{
    fb.innerHTML=`<span class="fb-wrong">✖ Правильно: ${q.a}</span>`;
    if(q.t==='type'||q.t==='gap'){
      const inp=document.getElementById('fillin');
      inp.style.border='2px solid var(--red)';
    }
    else{ document.querySelectorAll('.opt').forEach(o=>{ if(o.getAttribute('data-v')===String(q.a)) o.classList.add('correct'); }); document.querySelectorAll('.opt.sel').forEach(o=>o.classList.add('wrong')); }
    // не засчитываем, даём ещё шанс
    setTimeout(()=>{
      fb.innerHTML='';
      if(q.t==='choice'){
        document.querySelectorAll('.opt').forEach(o=>{o.classList.remove('correct','wrong','sel');});
        LS.sel=null; document.getElementById('chkB').disabled=true;
      } else {
        const inp=document.getElementById('fillin'); if(inp){ inp.value=''; inp.style.border=''; inp.focus(); }
      }
    },900);
  }
}
function correctNow(){
  const q=LS.lesson.q[LS.idx];
  LS.correct++;
  DATA.done++;
  const fb=document.getElementById('fb');
  fb.innerHTML=`<span class="fb-correct">✔ Верно!</span>`;
  if(q.t==='choice'){
    document.querySelectorAll('.opt.sel').forEach(o=>o.classList.remove('sel','wrong'));
    document.querySelectorAll('.opt[data-v="'+q.a+'"]').forEach(o=>o.classList.add('correct'));
    document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  } else if(q.t==='type'||q.t==='gap'){
    const inp=document.getElementById('fillin'); if(inp){ inp.disabled=true; inp.style.border='2px solid var(--green)'; }
  } else if(q.t==='match'){
    // уже сопоставлено
  }
  save();
  renderActionsNext();
}
function nextQ(){
  LS.idx++; showQuestion();
}
function leaveLesson(){
  LS.idx=999; renderMenu();
}
function finishLesson(){
  const l=LS.lesson;
  DATA.completed[l.id]=true;
  DATA.stars[l.id]=3;
  DATA.xp+=l.xp;
  save();
  showComplete(l.xp, l.name);
}

// ===== Экран завершения =====
function showComplete(xp,name){
  renderConfetti();
  overlayRoot.innerHTML=`<div class="overlay"><div class="complete">
    <div class="big">🎉</div>
    <h2>Урок пройден!</h2>
    <p>${name}</p>
    <div class="xpget">+${xp} XP</div>
    <button class="btn-done" onclick="closeComplete()">Продолжить</button>
  </div></div>`;
}
function closeComplete(){ overlayRoot.innerHTML=''; renderMenu(); }
function renderConfetti(){
  const colors=['#e8853d','#f2b04c','#7fb257','#e05a3d','#fff'];
  let html='';
  for(let i=0;i<40;i++){
    const left=Math.random()*100; const delay=Math.random()*3; const dur=3+Math.random()*3;
    const c=colors[i%colors.length];
    html+=`<span style="left:${left}%;background:${c};animation-duration:${dur}s;animation-delay:${delay}s"></span>`;
  }
  overlayRoot.innerHTML+=`<div class="confetti">${html}</div>`;
}

// ===== Инструменты =====
function renderDict(){
  const words=collectWords();
  render(`<div class="topbar"><button class="back" onclick="renderMenu()">←</button><h2>📚 Словарь</h2></div>
  <div class="card"><div class="wordlist">
    ${words.map(w=>`<div class="w"><div><span class="fr">${w.fr}</span> <span class="ru">— ${w.ru}</span></div><span>${w.tr}</span></div>`).join('')}
  </div></div>`);
}
function collectWords(){
  const seen={}; const out=[];
  UNITS.forEach(u=>u.lessons.forEach(l=>l.q.forEach(q=>{
    const list=[]; 
    if(q.t==='type') list.push([q.q,q.a]);
    else if(q.t==='match') q.pairs.forEach(p=>{ out.push({fr:p[0],ru:p[1],tr:''}); });
  })));
  return dedupe(out);
}
function dedupe(a){ const m={}; const r=[]; a.forEach(x=>{ if(!m[x.fr]){m[x.fr]=1;r.push(x);} }); return r; }

function renderConj(){
  render(`<div class="topbar"><button class="back" onclick="renderMenu()">←</button><h2>🔤 Спряжения</h2></div>
  <div class="card">
    <p class="sub">Выбери глагол или введи свой</p>
    <div class="grid2">
      ${Object.keys(IRREGULAR).map(v=>`<button class="mbtn" onclick="showConj('${v}')"><span class="emoji">📖</span>${v}</button>`).join('')}
    </div>
    <input type="text" id="conjin" placeholder="Введи глагол…">
    <button class="btn-check btn" style="width:100%;border:none;border-radius:13px;padding:14px;font-weight:700" onclick="conjInput()">Спрягать</button>
    <div id="conjout"></div>
  </div>`);
}
function showConj(v){ const r=conjugate(v); document.getElementById('conjout').innerHTML=`<div class="card center"><div class="big">${v}</div><div class="sub">${r}</div></div>`; }
function conjInput(){ const v=document.getElementById('conjin').value; const r=conjugate(v); if(!r){document.getElementById('conjout').innerHTML='<div class="banner">Не распознал глагол</div>'; return;} showConj(v); }

function renderDial(){
  render(`<div class="topbar"><button class="back" onclick="renderMenu()">←</button><h2>💬 Фразы</h2></div>
  <div class="card">
    ${DIALOGUES.map((d,i)=>`<div class="wordlist"><div class="w" style="cursor:pointer" onclick="showDial(${i})"><span class="fr">${d.name}</span><span>→</span></div></div>`).join('')}
  </div>`);
}
function showDial(i){ const d=DIALOGUES[i];
  render(`<div class="topbar"><button class="back" onclick="renderDial()">←</button><h2>${d.name}</h2></div>
  <div class="card"><div class="sub" style="white-space:pre-line;font-size:15px;line-height:1.7">${d.text}</div></div>
  <div class="card"><h2>🇷🇺 Перевод</h2><div class="sub" style="white-space:pre-line">${d.ru}</div></div>`);
}

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

renderMenu();
</script>
